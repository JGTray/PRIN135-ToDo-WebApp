<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIN135 - Activity 12 | To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

    <body>

        <main class="todo-card">
            <header class="todo-header">
                <h1>To Do List</h1>
            </header>

        <form class="add-form" method="post">
            <input type="text" class="task-input" name="task" placeholder="What needs to be done?" required>
            <input type="number" class="hours-input" placeholder="Hours"required>
            <button type="submit" class="add-button">Add</button>
        </form>

        <div class="control-bar">
            <div class="filter-buttons">
                <button type="button" class="filter-button" data-filter="All">All</button>
                <button type="button" class="filter-button" data-filter="Active">Active</button>
                <button type="button" class="filter-button" data-filter="Completed">Completed</button>
            </div>
        </div>

    <div>
        <form>
            <label>   
                <ul class="task-list">
                    <li class="task-item">
                            <input type="checkbox" class="task-checkbox">
                            <label class="task-text">Sample Task 1</label>
                            <span class="task-difficulty">Easy &middot; 1h</span>
                            <button type="button" class="button-delete">Delete</button>    
                    </li>

                    <li class="task-item">
                            <input type="checkbox" class="task-checkbox">
                            <label class="task-text">Sample Task 2</label>
                            <span class="task-difficulty">Medium &middot; 4h</span>
                            <button type="button" class="button-delete">Delete</button>    
                    </li>

                    <li class="task-item">
                            <input type="checkbox" class="task-checkbox">
                            <label class="task-text">Sample Task 3</label>
                            <span class="task-difficulty">Hard &middot; 6h</span>
                            <button type="button" class="button-delete">Delete</button>    
                    </li>

                    <li class="task-item">
                            <input type="checkbox" class="task-checkbox">
                            <label class="task-text">Sample Task 4</label>
                            <span class="task-difficulty">Easy &middot; 2h</span>
                            <button type="button" class="button-delete">Delete</button>    
                    </li>
                </ul>
            </label>
        </form>
    </div>
        <footer class="todo-footer">
            <span class="task-count">4 tasks left</span>
            <button type="button" class="clear-completed">Clear Completed</button>

        </footer>

        <p class="text-hint">
            Easy: up to 2h &middot; Medium: over 2h &middot; Hard: over 5h <br>
            Double-click a task or its label to edit the text or hours. Press Enter to save, Esc to cancel. <br>
        </p>
    </body>

</html>
